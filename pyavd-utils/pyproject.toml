[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "pyavd-utils"
version = "0.0.1"

[dependency-groups]
pytest = [
    "pytest",
]
coverage = [
    "coverage[toml]",
]

[tool.setuptools.packages.find]
include = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "pyavd_utils._passwords"
path = "rust/passwords/Cargo.toml"
binding = "PyO3"
